name: License Header Check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff #v5
        with:
          go-version: '1.21'
          cache: false

      - name: Check license headers
        # The -check flag ensures the workflow fails if headers are missing.
        run: go run github.com/google/addlicense@v1.1.1 -check -c "Google LLC" -l apache .
