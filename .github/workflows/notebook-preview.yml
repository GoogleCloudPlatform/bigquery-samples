name: Notebook Preview Linker

on:
  pull_request:
    paths:
      - '**.ipynb'

jobs:
  comment-nbviewer-links:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Find modified notebooks
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: '**.ipynb'

      - name: Comment on PR with nbviewer links
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          COMMENT="### 📓 Jupyter Notebook Previews\n\nI detected notebook changes in this PR! Here are the rendered previews for easier reviewing:\n\n"
          
          # Loop through the environment variable securely
          for file in $ALL_CHANGED_FILES; do
            NBVIEWER_URL="https://nbviewer.org/github/$REPO/blob/$BRANCH/$file"
            COMMENT="$COMMENT- [Preview \`$file\`]($NBVIEWER_URL)\n"
          done
          
          gh pr comment $PR_URL -b "$COMMENT"
