name: Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: '3.12'

      - name: Install Ruff linter
        run: python -m pip install --upgrade pip ruff

      - name: Lint Python files and Jupyter notebooks
        run: |
          # Check syntax errors, undefined names, and critical issues across all .py and .ipynb files
          ruff check --select E9,F63,F7,F82 .

      - name: Validate Jupyter notebooks and sample metadata
        run: |
          python3 - <<'EOF'
          import json
          import pathlib
          import sys

          errors = []
          for nb_path in sorted(pathlib.Path(".").rglob("*.ipynb")):
              if ".ipynb_checkpoints" in nb_path.parts:
                  errors.append(f"Checkpoint file must not be committed: {nb_path}")
                  continue
              try:
                  with nb_path.open("r", encoding="utf-8") as f:
                      data = json.load(f)
                  if "cells" not in data or not isinstance(data["cells"], list):
                      errors.append(f"Invalid notebook structure (missing 'cells'): {nb_path}")
              except Exception as exc:
                  errors.append(f"Invalid JSON in notebook {nb_path}: {exc}")

              sample_dir = nb_path.parent
              if not (sample_dir / "README.md").exists():
                  errors.append(f"Missing README.md in sample directory: {sample_dir}")
              if not (sample_dir / "SAMPLEOWNERS").exists():
                  errors.append(f"Missing SAMPLEOWNERS in sample directory: {sample_dir}")

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)
          print("All notebooks and sample directories passed validation.")
          EOF
